services:
  fin-diag:
    build: .
    image: fin-diag:latest
    container_name: fin-diag
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      TZ: Asia/Shanghai
      PORT: 8501
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import sys,urllib.request;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health',timeout=4).read().strip()==b'ok' else 1)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
